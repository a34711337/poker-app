    function detectLanguage() {
      const browserLang = navigator.language || navigator.userLanguage || "en";

      if (browserLang.startsWith("zh-TW") || browserLang.startsWith("zh-HK") || browserLang.startsWith("zh-MO")) return "zhTw";
      if (browserLang.startsWith("zh")) return "zhCn";
      if (browserLang.startsWith("ko")) return "ko";
      if (browserLang.startsWith("ja")) return "ja";
      if (browserLang.startsWith("de")) return "de";
      if (browserLang.startsWith("fr")) return "fr";
      if (browserLang.startsWith("ar")) return "ar";
      if (browserLang.startsWith("ru")) return "ru";
      if (browserLang.startsWith("tr")) return "tr";
      if (browserLang.startsWith("es")) return "es";
      if (browserLang.startsWith("it")) return "it";
      if (browserLang.startsWith("pl")) return "pl";
      if (browserLang.startsWith("pt")) return "pt";
      if (browserLang.startsWith("th")) return "th";
      if (browserLang.startsWith("id")) return "id";
      if (browserLang.startsWith("hi")) return "hi";
      if (browserLang.startsWith("bn")) return "bn";

      return "en";
    }

    function changeLanguage() {
      const selected = document.getElementById("languageSelect").value;
      const t = translations[selected] || translations.en;

      document.getElementById("title").innerText = t.title;
      document.getElementById("intro").innerText = t.intro;
      document.getElementById("contactTitle").innerText = t.contactTitle;
      document.getElementById("includeTitle").innerText = t.includeTitle;
      document.getElementById("includeText").innerText = t.includeText;
      document.getElementById("responseTitle").innerText = t.responseTitle;
      document.getElementById("responseText").innerText = t.responseText;

      document.documentElement.lang = selected;

      const card = document.getElementById("card");
      if (selected === "ar") {
        card.classList.add("rtl");
      } else {
        card.classList.remove("rtl");
      }

      localStorage.setItem("supportLanguage", selected);
    }

    const savedLanguage = localStorage.getItem("supportLanguage");
    const initialLanguage = savedLanguage || detectLanguage();

    document.getElementById("languageSelect").value = initialLanguage;
    changeLanguage();
  </script>
