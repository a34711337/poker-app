workflows:
  ios-workflow:
    name: iOS Workflow

    integrations:
      app_store_connect: poker-app-codemagic

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - push_fix_final

    scripts:
      - flutter clean
      - flutter pub get
      - name: Install iOS pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks
          pod repo update
          pod install
          cd ..

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release
          ls -R build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/clone/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true